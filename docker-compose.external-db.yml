# Joins the app to the Docker network of an existing PostgreSQL container, e.g. one from
# another Compose project, so EXTERNAL_DATABASE_URL can name that container:
#   EXTERNAL_DATABASE_NETWORK=<network> EXTERNAL_DATABASE_URL=postgres://...@<container>:5432/... \
#     docker compose -f docker-compose.yml -f docker-compose.external-db.yml up --build -d --no-deps app
services:
  app:
    networks: [default, external-database]

networks:
  external-database:
    external: true
    name: ${EXTERNAL_DATABASE_NETWORK:?set EXTERNAL_DATABASE_NETWORK to the database container's network}
