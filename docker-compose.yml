# Default:            docker compose up --build            (app + postgres, simulation mode)
# Existing database:  EXTERNAL_DATABASE_URL=postgres://... docker compose up --build --no-deps app
#
# Values come from .env (see .env.example). The database address is fixed here
# because it is a fact of this network.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: troubleshooter
      POSTGRES_PASSWORD: troubleshooter
      POSTGRES_DB: troubleshooter
    # Loopback only, for `make run` outside Docker; the app uses the Compose network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troubleshooter -d troubleshooter"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: ai-kubernetes-troubleshooter:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_PROXY_URL: http://oauth2-proxy:4180
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}
      # An existing PostgreSQL: set EXTERNAL_DATABASE_URL and start with `up --no-deps app`.
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgres://troubleshooter:troubleshooter@postgres:5432/troubleshooter?sslmode=disable}
      KUBERNETES_CLUSTER_NAME: ${KUBERNETES_CLUSTER_NAME:-local}
      KUBERNETES_ALLOWED_NAMESPACES: ${KUBERNETES_ALLOWED_NAMESPACES:-}
      KUBERNETES_CUSTOM_RESOURCES: ${KUBERNETES_CUSTOM_RESOURCES:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-262144}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # Simulation by default; add -f docker-compose.live.yml for a live cluster.
      SIMULATION_ENABLED: "true"
      SIMULATION_SCENARIO: ${SIMULATION_SCENARIO:-healthy}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-15m}
      JOB_QUEUE_CAPACITY: ${JOB_QUEUE_CAPACITY:-100}
      INVESTIGATION_TIMEOUT: ${INVESTIGATION_TIMEOUT:-180s}
      MAX_CONCURRENT_INVESTIGATIONS: ${MAX_CONCURRENT_INVESTIGATIONS:-4}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  oauth2-proxy:
    profiles: [auth]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command: [--config=/etc/oauth2-proxy.cfg]
    volumes:
      - ./deployments/kubernetes-authenticated/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-}
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-troubleshooter-users}
      OAUTH2_PROXY_REDIRECT_URL: ${AUTH_PUBLIC_URL:-}/oauth2/callback
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
