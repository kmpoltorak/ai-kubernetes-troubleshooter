name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: ci
    outputs:
      image_artifact:
        value: ${{ jobs.build.outputs.image_artifact }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration,authintegration,modeleval,e2e ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Build with the workflow's Go so the linter supports the go.mod version.
          install-mode: goinstall
          args: --build-tags integration,authintegration,modeleval,e2e

  kubernetes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.36.4", "1.37.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install image transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.image_artifact }}
          path: candidate
      - name: Install verified kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/akt-e2e-bin"
          mkdir "$tools"
          cd "$tools"
          curl -fLsS --connect-timeout 10 --max-time 120 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fLsS --connect-timeout 10 --max-time 120 -o kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          printf '%s  kind\n' "$(cut -d ' ' -f1 kind.sha256sum)" | sha256sum --check -
          curl -fLsS --connect-timeout 10 --max-time 120 -o kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fLsS --connect-timeout 10 --max-time 120 -o kubectl.sha256 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check -
          chmod +x kind kubectl
          echo "$tools" >> "$GITHUB_PATH"
      - name: Live diagnostics, RBAC and NetworkPolicy
        env:
          E2E_KUBERNETES_VERSION: ${{ matrix.kubernetes }}
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/report-e2e-${{ matrix.kubernetes }}
          E2E_IMAGE_ARTIFACT: ${{ github.workspace }}/candidate
        run: make test-e2e
      - name: Upload bounded test output
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kubernetes-${{ matrix.kubernetes }}
          path: report-e2e-${{ matrix.kubernetes }}/
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

  authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: OAuth2 Proxy and OIDC integration
        run: make test-auth
      - name: Render authenticated Kubernetes configuration
        run: kubectl kustomize deployments/kubernetes-authenticated > /dev/null

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: troubleshooter
          POSTGRES_PASSWORD: troubleshooter
          POSTGRES_DB: troubleshooter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U troubleshooter -d troubleshooter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://troubleshooter:troubleshooter@localhost:5432/troubleshooter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags integration -count=1 -p 1 ./...
      - name: Upgrade, backup and restore
        run: bash scripts/test-upgrade.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Render UI history and failure states
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser flows against the real binary
        run: bash scripts/test-browser.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-traces
          path: web/report-browser/
          retention-days: 3

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, web]
    outputs:
      image_artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - uses: docker/setup-buildx-action@v4
      - name: Install image transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build one OCI candidate
        env:
          BUILD_VERSION: ${{ inputs.version || 'ci' }}
        run: bash scripts/image-artifact.sh create candidate "$BUILD_VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Check artifact transport and rejection paths
        run: bash scripts/test-image-artifact.sh candidate
      - name: Check versioned release manifests
        run: go test -tags e2e -count=1 ./tests/release
      - id: artifact
        run: echo "name=tested-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: candidate/
          retention-days: 3
          if-no-files-found: error
