# A kubeconfig mounted from a Secret, as for a remote cluster. It holds no secret:
# it points at the kind API through the pod's own ServiceAccount token file.
apiVersion: v1
kind: Config
clusters:
  - name: kind
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: troubleshooter
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: mirror
    context: {cluster: kind, user: troubleshooter}
current-context: mirror
