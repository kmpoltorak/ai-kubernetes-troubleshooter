apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: troubleshooter-auth
  namespace: troubleshooter
spec:
  podSelector:
    matchLabels:
      app: troubleshooter-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: troubleshooter
      ports:
        - protocol: TCP
          port: 4180
