provider = "oidc"
http_address = "0.0.0.0:4180"
upstreams = ["static://202"]
set_xauthrequest = true
skip_provider_button = true
skip_jwt_bearer_tokens = true
bearer_token_login_fallback = false
email_domains = ["*"]
allowed_groups = ["troubleshooter-users"]
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
cookie_name = "__Host-troubleshooter_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "8h"
# No access/ID tokens or callback authorization codes in request/auth logs.
request_logging = false
auth_logging = false
