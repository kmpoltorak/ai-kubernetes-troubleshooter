apiVersion: v1
kind: ConfigMap
metadata:
  name: troubleshooter-config
  namespace: troubleshooter
data:
  APP_ENV: production
  LOG_LEVEL: info
  # No identity provider needed for local/test installs. Use ../kubernetes-authenticated
  # with AUTH_ENABLED=true when access must require login.
  AUTH_ENABLED: "false"
  # Live mode: in-cluster ServiceAccount credentials (KUBECONFIG unset).
  SIMULATION_ENABLED: "false"
  KUBERNETES_CLUSTER_NAME: local
  # Must match the namespaces that have a troubleshooter-reader RoleBinding.
  KUBERNETES_ALLOWED_NAMESPACES: payments
  LLM_PROVIDER: rules
  LLM_TIMEOUT: 60s
  LLM_MAX_INPUT_BYTES: "262144"
  JOB_TIMEOUT: 15m
  JOB_QUEUE_CAPACITY: "100"
  INVESTIGATION_TIMEOUT: 90s
  MAX_CONCURRENT_INVESTIGATIONS: "4"
  RATE_LIMIT_RPS: "5"
