apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooter
  namespace: troubleshooter
  labels:
    app: troubleshooter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshooter
  template:
    metadata:
      labels:
        app: troubleshooter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: troubleshooter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kmpoltorak/ai-kubernetes-troubleshooter:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: troubleshooter-config
            - secretRef:
                name: troubleshooter-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
