# Example only. Create the real Secret out of band, e.g.:
#   kubectl -n troubleshooter create secret generic troubleshooter-secrets \
#     --from-literal=DATABASE_URL='postgres://...' --from-literal=OPENAI_API_KEY='sk-...'
apiVersion: v1
kind: Secret
metadata:
  name: troubleshooter-secrets
  namespace: troubleshooter
type: Opaque
stringData:
  DATABASE_URL: postgres://troubleshooter:CHANGE_ME@postgres.troubleshooter.svc:5432/troubleshooter?sslmode=require
  OPENAI_API_KEY: ""
