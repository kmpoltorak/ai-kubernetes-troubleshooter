# OPTIONAL, not part of kustomization.yaml.
#
# get_secret_metadata checks that Secrets referenced by a pod exist. The app
# reads them through the metadata API (PartialObjectMetadata), so values are
# never transferred and annotations are discarded. Kubernetes RBAC, however,
# cannot grant metadata-only access: "get secrets" also permits reading
# values with another client. Apply this only if that trade-off is
# acceptable. Without it the tool is recorded as failed (forbidden) and the
# investigation continues.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: troubleshooter-secret-metadata
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: troubleshooter-secret-metadata
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: troubleshooter-secret-metadata
subjects:
  - kind: ServiceAccount
    name: troubleshooter
    namespace: troubleshooter
