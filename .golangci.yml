version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers use plain http.Get/Post against httptest servers.
      - path: _test\.go
        linters: [noctx, gosec, bodyclose]

formatters:
  enable:
    - gofmt
